<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile — TradeVault</title>
    <link rel="icon" type="image/svg+xml" href="Images/favicon.svg?v=4">
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/profile.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body class="profile-body">
    <div class="ambient-rays"><i class="ray ray-1"></i><i class="ray ray-2"></i><i class="ray ray-3"></i></div>

    <div class="profile-top">
        <a href="index.html" class="profile-back">← Home</a>
        <a href="index.html#journal" class="profile-back">Open Journal</a>
        <div class="spacer"></div>
        <button id="logoutBtn" class="btn btn-secondary">Log Out</button>
    </div>

    <div class="profile-wrap">
        <!-- Left: identity card -->
        <div class="profile-card">
            <div class="avatar-ring">
                <img id="profileAvatar" alt="avatar" style="display:none">
                <div id="avatarPlaceholder" class="avatar-placeholder">T</div>
            </div>
            <div class="avatar-actions">
                <label class="btn btn-secondary btn-small" for="avatarInput">Change Photo</label>
                <input type="file" id="avatarInput" accept="image/*" style="display:none">
                <button id="avatarRemoveBtn" class="btn btn-text btn-small">Remove</button>
            </div>
            <h2 id="profUsername">@trader</h2>
            <p id="profName" class="prof-name"></p>
            <p id="profEmail" class="prof-email"></p>
            <p id="profSince" class="prof-since"></p>
        </div>

        <!-- Right: stats + edit -->
        <div class="profile-right">
            <div class="stats-row" id="profStats"></div>

            <div class="edit-card">
                <h3>Edit Profile</h3>
                <form id="profileForm">
                    <div class="edit-grid">
                        <div class="form-group"><label>Display Name</label><input class="form-control" id="editName" type="text"></div>
                        <div class="form-group"><label>Username</label><input class="form-control" id="editUsername" type="text"></div>
                        <div class="form-group"><label>Timezone</label><input class="form-control" id="editTimezone" type="text" placeholder="UTC"></div>
                        <div class="form-group"><label>Currency</label><input class="form-control" id="editCurrency" type="text" placeholder="USD"></div>
                        <div class="form-group" style="grid-column:1/-1;"><label>New Password (leave empty to keep current)</label><input class="form-control" id="editPassword" type="password" placeholder="••••••••"></div>
                    </div>
                    <button class="btn btn-primary" id="saveProfileBtn" type="submit">Save Changes</button>
                </form>
            </div>
        </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>

    <script src="js/config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/db.js"></script>
    <script src="js/profile.js"></script>
</body>
</html>
